name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  zig:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # No version pinned here on purpose. The action resolves it from
      # `build.zig.zon`'s `minimum_zig_version`, so the pin lives in exactly
      # one place.
      - uses: mlugg/setup-zig@v2
        with:
          cache-size-limit: 4096

      - name: Show version
        run: zig version

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test --summary all

      # Already verified inside the suite via its own --check mode. Repeated
      # here only so a failure names itself in the log rather than arriving
      # as one line inside a large test run.
      - name: Generated docs are in sync
        if: always()
        run: ./docs/synapse-bard/generate-cli-reference.sh --check

      - name: Rendered diagrams are in sync
        if: always()
        run: ./docs/synapse-bard/generate-diagrams.sh --check
