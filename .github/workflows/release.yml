name: release

# A release is cut by pushing a `vX.Y.Z` tag. workflow_dispatch takes an
# explicit `tag` input for a manual re-run and checks out that tag rather
# than whatever ref triggered the dispatch, so a manual run can never
# accidentally build off an untagged commit.
#
# The `ada-build` job builds the Ada crate's binaries natively on each platform
# and checks the installed npm packages (`ci/package.sh`); it runs for a
# pull request that touches how they are built. `ada-publish` only does an
# `npm publish --dry-run` of those artifacts, on a manual dispatch with
# `dry_run`; the Zig `release` job is what publishes a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "ada/**"
      - "ci/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist, e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Also run `npm publish --dry-run` of the Ada build"
        type: boolean
        default: false

permissions:
  contents: write
  # OIDC for npm's Trusted Publishing -- lets `npm publish` mint a
  # short-lived token itself instead of reading a stored NPM_TOKEN secret.
  # Each of the four @imunitic/synapse-bard* packages has a Trusted
  # Publisher configured on npmjs.com pointing at this exact workflow file.
  id-token: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    concurrency:
      group: release-tag
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # No version pinned here -- resolved from build.zig.zon's
      # minimum_zig_version, so the pin lives in exactly one place.
      # cache-size-limit raised for the same reason synapse's own tests.yml
      # raises it.
      - uses: mlugg/setup-zig@v2
        with:
          cache-size-limit: 4096

      - name: Resolve the release tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile each target
        run: |
          source ci/release-targets.sh
          for t in "${targets[@]}"; do
            zig build -Dtarget="$t" -Doptimize=ReleaseSafe -p "out/$t"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs a recent npm CLI.
      - name: Upgrade npm for OIDC trusted-publishing support
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN -- OIDC trusted publishing (id-token: write
      # above, plus each package's Trusted Publisher configured on
      # npmjs.com to trust this exact workflow file) is what authenticates
      # instead. npm detects the GitHub Actions OIDC environment
      # automatically; nothing here has to request or pass a token by hand.
      - name: Publish npm packages in lock-step
        run: |
          source ci/release-targets.sh
          v="${{ steps.tag.outputs.tag }}"
          v="${v#v}"

          dist_tag="latest"
          case "$v" in
            *-*)
              pre="${v#*-}"
              dist_tag="${pre%%.*}"
              ;;
          esac

          npm_platform_for() {
            case "$1" in
              x86_64-linux) echo linux-x64 ;;
              aarch64-linux) echo linux-arm64 ;;
              aarch64-macos) echo darwin-arm64 ;;
              *)
                echo "no npm platform package mapped for target: $1" >&2
                exit 1
                ;;
            esac
          }

          # Re-run safety: a re-dispatch of an already-published tag skips
          # republishing instead of failing on npm's immutable-version rule.
          publish_if_new() {
            local dir="$1" name="$2"
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name@$v already published -- skipping"
            else
              npm publish "./$dir" --access public --tag "$dist_tag"
            fi
          }

          for t in "${targets[@]}"; do
            plat="$(npm_platform_for "$t")"
            dest="packages/synapse-bard/platforms/$plat/bin"
            mkdir -p "$dest"
            cp "out/$t/bin/synapse-bard" "out/$t/bin/synapse-bard-hook" "$dest/"
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v' "packages/synapse-bard/platforms/$plat/package.json" > "$tmp"
            mv "$tmp" "packages/synapse-bard/platforms/$plat/package.json"
            publish_if_new "packages/synapse-bard/platforms/$plat" "@imunitic/synapse-bard-$plat"
          done

          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v | .optionalDependencies |= map_values($v)' \
            packages/synapse-bard/package.json > "$tmp"
          mv "$tmp" packages/synapse-bard/package.json
          publish_if_new "packages/synapse-bard" "@imunitic/synapse-bard"

  ada-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, plat: linux-x64 }
          - { os: ubuntu-24.04-arm, plat: linux-arm64 }
          # macos-15, not macos-latest: the macOS 26 image's SDK lists an
          # architecture that the linker of the GNAT toolchain rejects.
          - { os: macos-15, plat: darwin-arm64 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: alire-project/setup-alire@v6
        if: runner.os != 'Linux'
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the Linux binaries against glibc 2.28
        if: runner.os == 'Linux'
        run: ci/linux-release.sh

      - name: Build the macOS binaries
        if: runner.os != 'Linux'
        working-directory: ada
        run: just release

      - name: Check the installed package
        env:
          GLIBC_FLOOR: ${{ runner.os == 'Linux' && '2.28' || '' }}
        run: ci/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.plat }}
          path: |
            ada/bin/synapse-bard
            ada/bin/synapse-bard-hook
          if-no-files-found: error

  ada-publish:
    needs: ada-build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Dry-run the npm publish of the Ada build
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          v="${TAG#v}"
          for plat in linux-x64 linux-arm64 darwin-arm64; do
            dest="packages/synapse-bard/platforms/$plat/bin"
            mkdir -p "$dest"
            cp "artifacts/bin-$plat/synapse-bard" "artifacts/bin-$plat/synapse-bard-hook" "$dest/"
            chmod +x "$dest/synapse-bard" "$dest/synapse-bard-hook"
            tmp=$(mktemp)
            jq --arg v "$v" '.version = $v' "packages/synapse-bard/platforms/$plat/package.json" > "$tmp"
            mv "$tmp" "packages/synapse-bard/platforms/$plat/package.json"
            npm publish "./packages/synapse-bard/platforms/$plat" --access public --dry-run
          done
          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v | .optionalDependencies |= map_values($v)' \
            packages/synapse-bard/package.json > "$tmp"
          mv "$tmp" packages/synapse-bard/package.json
          npm publish ./packages/synapse-bard --access public --dry-run
