name = "synapse_bard"
description = "synapse-bard: Bible-graph and Writer's notes vault for a fiction bible"
version = "0.0.0-dev"

authors = ["Ivica Munitic"]
maintainers = ["Ivica Munitic <imunitic@gmail.com>"]
maintainers-logins = []
licenses = "MIT"
tags = []

executables = ["synapse-bard", "synapse-bard-hook"]

[build-switches]
validation.contracts = "Yes"
validation.style_checks = "Yes"
validation.compile_checks = "Warnings"
"*".ada_version = "Ada2022"

[gpr-set-externals.'case(os)']
windows = { SYNAPSE_OS = "windows" }
'...' = { SYNAPSE_OS = "posix" }

[[depends-on]]
synapse = "*"

[[pins]]
# Synapse release v0.14.4; bump with `alr pin synapse --use=<url> --commit=<release tag> --subdir=synapse`.
synapse = { url='https://github.com/imunitic/synapse', subdir='synapse', commit='6379e28ba612515d966a10bed102d0b254e5dce9' }
